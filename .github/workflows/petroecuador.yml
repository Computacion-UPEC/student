# Recolecta ofertas de empleo y guarda su historial:
#   - EP Petroecuador -> lib/data/petroecuador-jobs.json (algunas convocatorias duran solo 2 días)
#   - Bancos y cooperativas (Banco Pichincha, Cooperativa JEP) -> lib/data/finance-jobs.json
#   - Convocatoria mensual de Educa Empleo (docentes LOEI) -> lib/data/educa-empleo.json
# Corre dos veces al día. Solo hace commit si hay cambios, y ese commit dispara el despliegue en Vercel.
name: Recolectar convocatorias

on:
  schedule:
    - cron: "0 13 * * *" # 08:00 en Ecuador
    - cron: "0 23 * * *" # 18:00 en Ecuador
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: petroecuador-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/petroecuador/package-lock.json

      - name: Instalar el recolector de Petroecuador
        working-directory: scripts/petroecuador
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium

      # Si un recolector falla, el otro igual guarda sus datos
      - name: Recolectar convocatorias de Petroecuador
        continue-on-error: true
        working-directory: scripts/petroecuador
        run: node collect.mjs

      - name: Recolectar ofertas de bancos y cooperativas
        continue-on-error: true
        run: node scripts/finance/collect.mjs

      - name: Detectar convocatoria mensual de Educa Empleo
        continue-on-error: true
        run: node scripts/educa-empleo/collect.mjs

      - name: Guardar cambios
        run: |
          if git diff --quiet -- lib/data/petroecuador-jobs.json lib/data/finance-jobs.json lib/data/educa-empleo.json; then
            echo "Sin cambios en las convocatorias."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/petroecuador-jobs.json lib/data/finance-jobs.json lib/data/educa-empleo.json
          git commit -m "Update job offers"
          git push
