# Recolecta ofertas de empleo y guarda su historial:
#   - EP Petroecuador -> lib/data/petroecuador-jobs.json (algunas convocatorias duran solo 2 días)
#   - Bancos y cooperativas (Banco Pichincha, Cooperativa JEP) -> lib/data/finance-jobs.json
#   - Convocatoria mensual de Educa Empleo (docentes LOEI) -> lib/data/educa-empleo.json
#   - Empresas de software con vacantes en Ecuador (Devsu, Stack Builders, vía Workable) -> lib/data/tech-jobs.json
#   - INEC, Trabaja con nosotros (postulaciones de 1 a 3 días) -> lib/data/inec-jobs.json
#   - Concursos del sector público (LOSEP) en Encuentra Empleo, solo cargos de TI -> lib/data/public-jobs.json
#   - Empresas privadas grandes (Holcim, Arca Continental, Farmaenlace, Tuti) -> lib/data/private-jobs.json
# Corre dos veces al día. Solo hace commit si hay cambios, y ese commit dispara el despliegue en Vercel.
name: Recolectar convocatorias

on:
  schedule:
    - cron: "0 13 * * *" # 08:00 en Ecuador
    - cron: "0 23 * * *" # 18:00 en Ecuador
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write # aviso de recolectores con fallas

concurrency:
  group: petroecuador-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # bash con pipefail: si un recolector falla, el `| tee` no oculta el error
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/petroecuador/package-lock.json

      - name: Instalar el recolector de Petroecuador
        working-directory: scripts/petroecuador
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium

      # Si un recolector falla, el otro igual guarda sus datos
      - name: Recolectar convocatorias de Petroecuador
        id: petroecuador
        continue-on-error: true
        working-directory: scripts/petroecuador
        run: node collect.mjs 2>&1 | tee -a "$RUNNER_TEMP/recolectores.log"

      - name: Recolectar ofertas de bancos y cooperativas
        id: finanzas
        continue-on-error: true
        run: node scripts/finance/collect.mjs 2>&1 | tee -a "$RUNNER_TEMP/recolectores.log"

      - name: Detectar convocatoria mensual de Educa Empleo
        id: educa
        continue-on-error: true
        run: node scripts/educa-empleo/collect.mjs 2>&1 | tee -a "$RUNNER_TEMP/recolectores.log"

      - name: Recolectar ofertas de empresas de software
        id: software
        continue-on-error: true
        run: node scripts/tech/collect.mjs 2>&1 | tee -a "$RUNNER_TEMP/recolectores.log"

      - name: Recolectar ofertas de empresas privadas grandes
        id: privadas
        continue-on-error: true
        run: node scripts/private/collect.mjs 2>&1 | tee -a "$RUNNER_TEMP/recolectores.log"

      - name: Recolectar convocatorias del INEC
        id: inec
        continue-on-error: true
        run: |
          # pdftotext saca el enlace de postulación de cada PDF de bases
          command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils)
          node scripts/inec/collect.mjs 2>&1 | tee -a "$RUNNER_TEMP/recolectores.log"

      # Usa el navegador sin interfaz instalado para Petroecuador
      - name: Recolectar concursos del sector público (Encuentra Empleo)
        id: concursos
        continue-on-error: true
        run: node scripts/encuentra-empleo/collect.mjs 2>&1 | tee -a "$RUNNER_TEMP/recolectores.log"

      - name: Guardar cambios
        run: |
          if git diff --quiet -- lib/data/petroecuador-jobs.json lib/data/finance-jobs.json lib/data/educa-empleo.json lib/data/tech-jobs.json lib/data/inec-jobs.json lib/data/public-jobs.json lib/data/private-jobs.json; then
            echo "Sin cambios en las convocatorias."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/petroecuador-jobs.json lib/data/finance-jobs.json lib/data/educa-empleo.json lib/data/tech-jobs.json lib/data/inec-jobs.json lib/data/public-jobs.json lib/data/private-jobs.json
          git commit -m "Update job offers"
          # Si main avanzó durante la recolección (p. ej. se fusionó un PR), se integra antes de subir
          for intento in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((intento * 10))
          done
          exit 1

      # Abre (o actualiza) un issue si un recolector falló o una fuente avisó un error, y lo cierra cuando todo vuelve
      # a funcionar: así se nota cuando un portal cambia o se cae (p. ej. una página que empieza a responder 404)
      - name: Avisar recolectores con fallas
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADOS: >-
            Petroecuador=${{ steps.petroecuador.outcome }}
            Bancos=${{ steps.finanzas.outcome }}
            Educa-Empleo=${{ steps.educa.outcome }}
            Software=${{ steps.software.outcome }}
            Privadas=${{ steps.privadas.outcome }}
            INEC=${{ steps.inec.outcome }}
            Concursos=${{ steps.concursos.outcome }}
          CORRIDA: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITULO="Recolectores de ofertas con fallas"
          fallidos=$(for r in $RESULTADOS; do [ "${r#*=}" = failure ] && echo "- ${r%%=*}: el recolector falló"; done || true)
          avisos=$(grep -h '^::warning::' "$RUNNER_TEMP/recolectores.log" 2>/dev/null | sed 's/^::warning::/- /' | sort -u || true)
          abierto=$(gh issue list --state open --search "in:title \"$TITULO\"" --json number -q '.[0].number' || true)
          if [ -z "$fallidos$avisos" ]; then
            [ -n "$abierto" ] && gh issue close "$abierto" --comment "Todas las fuentes respondieron bien en $CORRIDA."
            exit 0
          fi
          cuerpo=$(printf 'Corrida: %s\n\n%s\n%s\n\nRevisa el registro de la corrida; si el portal cambió, ajusta su recolector en scripts/.' "$CORRIDA" "$fallidos" "$avisos")
          if [ -n "$abierto" ]; then
            gh issue comment "$abierto" --body "$cuerpo"
          else
            gh issue create --title "$TITULO" --body "$cuerpo"
          fi
