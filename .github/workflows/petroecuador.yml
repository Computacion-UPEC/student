# Recolecta ofertas de empleo y guarda su historial:
#   - EP Petroecuador -> lib/data/petroecuador-jobs.json (algunas convocatorias duran solo 2 días)
#   - Bancos y cooperativas (Banco Pichincha, Cooperativa JEP) -> lib/data/finance-jobs.json
#   - Convocatoria mensual de Educa Empleo (docentes LOEI) -> lib/data/educa-empleo.json
#   - Empresas de software con vacantes en Ecuador (Devsu, Stack Builders, vía Workable) -> lib/data/tech-jobs.json
#   - INEC, Trabaja con nosotros (postulaciones de 1 a 3 días) -> lib/data/inec-jobs.json
#   - Concursos del sector público (LOSEP) en Encuentra Empleo, solo cargos de TI -> lib/data/public-jobs.json
#   - Empresas privadas grandes (Holcim, Arca Continental, Farmaenlace, Tuti) -> lib/data/private-jobs.json
# Corre dos veces al día. Solo hace commit si hay cambios, y ese commit dispara el despliegue en Vercel.
name: Recolectar convocatorias

on:
  schedule:
    - cron: "0 13 * * *" # 08:00 en Ecuador
    - cron: "0 23 * * *" # 18:00 en Ecuador
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: petroecuador-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/petroecuador/package-lock.json

      - name: Instalar el recolector de Petroecuador
        working-directory: scripts/petroecuador
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium

      # Si un recolector falla, el otro igual guarda sus datos
      - name: Recolectar convocatorias de Petroecuador
        continue-on-error: true
        working-directory: scripts/petroecuador
        run: node collect.mjs

      - name: Recolectar ofertas de bancos y cooperativas
        continue-on-error: true
        run: node scripts/finance/collect.mjs

      - name: Detectar convocatoria mensual de Educa Empleo
        continue-on-error: true
        run: node scripts/educa-empleo/collect.mjs

      - name: Recolectar ofertas de empresas de software
        continue-on-error: true
        run: node scripts/tech/collect.mjs

      - name: Recolectar ofertas de empresas privadas grandes
        continue-on-error: true
        run: node scripts/private/collect.mjs

      - name: Recolectar convocatorias del INEC
        continue-on-error: true
        run: |
          # pdftotext saca el enlace de postulación de cada PDF de bases
          command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends poppler-utils)
          node scripts/inec/collect.mjs

      # Usa el navegador sin interfaz instalado para Petroecuador
      - name: Recolectar concursos del sector público (Encuentra Empleo)
        continue-on-error: true
        run: node scripts/encuentra-empleo/collect.mjs

      - name: Guardar cambios
        run: |
          if git diff --quiet -- lib/data/petroecuador-jobs.json lib/data/finance-jobs.json lib/data/educa-empleo.json lib/data/tech-jobs.json lib/data/inec-jobs.json lib/data/public-jobs.json lib/data/private-jobs.json; then
            echo "Sin cambios en las convocatorias."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/petroecuador-jobs.json lib/data/finance-jobs.json lib/data/educa-empleo.json lib/data/tech-jobs.json lib/data/inec-jobs.json lib/data/public-jobs.json lib/data/private-jobs.json
          git commit -m "Update job offers"
          git push
